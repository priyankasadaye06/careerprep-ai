<!DOCTYPE html>
<html>
<head>
    <title>CareerPrep AI</title>
    <link rel="stylesheet" href="/static/css/style.css">

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    position: relative;
}

/* Background */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: url("/static/images/background.png") no-repeat center center;
    background-size: cover;
    filter: brightness(0.6);
    z-index: -1;
}

/* Navbar */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 30px;
    color: white;
}

.logo {
    margin: 0;
}

/* Profile Dropdown */
.profile {
    position: relative;
    cursor: pointer;
}

.dropdown {
    display: none;
    position: absolute;
    right: 0;
    top: 40px;
    background: white;
    color: black;
    padding: 10px;
    border-radius: 10px;
    min-width: 150px;
}

.profile:hover .dropdown {
    display: block;
}

.dropdown a {
    display: block;
    padding: 8px;
    text-decoration: none;
    color: black;
}

.dropdown a:hover {
    background: #eee;
}

/* Hero */
.hero {
    text-align: center;
    color: white;
    margin-top: 100px;
}

/* Buttons */
.actions {
    margin-top: 30px;
}

.btn {
    padding: 12px 20px;
    margin: 10px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
}

.primary {
    background: #4a6cf7;
    color: white;
}

.secondary {
    background: white;
    color: black;
}

.btn:hover {
    opacity: 0.9;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    <h2 class="logo">CareerPrep-AI</h2>

    <div class="profile">
        👤 {{ name }}

        <div class="dropdown">
            <a href="/dashboard">Dashboard</a>
            <a href="/logout">Logout</a>
        </div>
    </div>
</nav>

<!-- HERO SECTION -->
<section class="hero">
    <h1>AI-Powered Resume & Interview Preparation</h1>

    <p>
        Generate ATS-friendly resumes and practice interview questions
        tailored to your profile and target role.
    </p>

    <div class="actions">
        <a href="/resume" class="btn primary">📄 Generate Resume</a>
        <a href="/interview" class="btn secondary">🤖 Interview Training</a>
       
    </div>
</section>

</body>
</html>
