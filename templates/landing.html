<!DOCTYPE html>
<html>
<head>
    <title>CareerPrep AI</title>
    <link rel="stylesheet" href="/static/css/style.css">
<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    position: relative;
}

body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    background: url("/static/images/background.png") no-repeat center center;
    background-size: cover;

    filter: brightness(0.6); /* darkens */
    z-index: -1;
}
.container {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    padding: 30px;
    border-radius: 15px;
}
</style>
</head>
<body>

<nav class="navbar">
    <h2 class="logo">CareerPrep-AI</h2>
    <div class="profile">👤</div>
</nav>

<section class="hero">
    <h1>AI-Powered Resume & Interview Preparation</h1>
    <p>
        Generate ATS-friendly resumes and practice interview questions
        tailored to your profile and target role.
    </p>

    <div class="actions">
        <a href="/resume" class="btn primary">Generate Resume</a>
        <a href="/interview" class="btn secondary">Interview Training</a>
    </div>
</section>

</body>
</html>
