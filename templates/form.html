<!DOCTYPE html>
<html>
<head>
    <title>Resume Form</title>
</head>
<body>

<h2>Resume Details – {{ role }}</h2>

<form method="POST" action="/preview">

    <!-- BASIC DETAILS -->
    <label>Full Name</label><br>
    <input type="text" name="name" required><br><br>

    <label>Email</label><br>
    <input type="email" name="email" required><br><br>

    <label>Phone</label><br>
    <input type="text" name="phone" required><br><br>

    <label>LinkedIn</label><br>
    <input type="text" name="linkedin"><br><br>

    <label>GitHub</label><br>
    <input type="text" name="github"><br><br>

    <!-- ROLE-SPECIFIC FIELDS -->
    {% if role == "Data Analyst" %}
        <label>Tools (SQL, Excel, Power BI)</label><br>
        <input type="text" name="tools"><br><br>

    {% elif role == "ML Engineer" %}
        <label>ML Algorithms</label><br>
        <input type="text" name="ml_skills"><br><br>

    {% elif role == "Software Engineer" %}
        <label>System Design Experience</label><br>
        <input type="text" name="system_design"><br><br>
    {% endif %}

    <!-- NORMAL SUBMIT -->
    <button type="submit">Generate Resume</button>

    <!-- SAMPLE DATA BUTTON -->
    <div style="margin-top: 20px; text-align: center;">
        <button type="submit" name="use_sample" value="true"
            style="
                background: #2d6cdf;
                color: white;
                padding: 10px 18px;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-weight: 600;
            ">
            ⚡ Use Sample Data
        </button>
    </div>

</form>

</body>
</html>
