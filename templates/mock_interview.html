<!DOCTYPE html>
<html>
<head>
    <title>Mock Interview</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<h1>Mock Interview</h1>

<form action="/submit-interview" method="POST">

    {% for q in questions %}
    <div style="margin-bottom:25px;">
        <p><strong>Question {{ loop.index }}:</strong> {{ q }}</p>

        <textarea 
            name="answer{{ loop.index }}" 
            rows="4" 
            cols="70"
            placeholder="Type your answer here..."
        ></textarea>
    </div>
    {% endfor %}

    <button type="submit">Submit Interview</button>

</form>

</body>
</html>
