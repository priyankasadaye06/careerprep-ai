<!DOCTYPE html>
<html>
<head>
<title>Login - CareerPrep AI</title>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#667eea,#764ba2);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* Card */
.box {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(12px);
    padding:30px;
    border-radius:15px;
    width:320px;
    text-align:center;
    color:white;
}

/* Inputs */
input {
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:8px;
}

/* Button */
button {
    width:100%;
    padding:12px;
    background:#4a6cf7;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover {
    background:#3a55d1;
}

/* ERROR MESSAGE */
.error {
    background: rgba(255, 0, 0, 0.2);
    color: #ffdddd;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 10px;
    animation: shake 0.4s ease, fadeIn 0.4s ease;
}

/* ANIMATION */
@keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    50% { transform: translateX(5px); }
    75% { transform: translateX(-5px); }
    100% { transform: translateX(0); }
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* Link */
a {
    color: white;
    text-decoration: underline;
}
</style>
</head>

<body>

<div class="box">

<h2>Login</h2>

<!-- 🔥 ERROR DISPLAY -->
{% if error %}
<div class="error">
    ❌ {{ error }}
</div>
{% endif %}

<form method="POST">

<input name="email" placeholder="Email" required>
<input name="password" type="password" placeholder="Password" required>

<button>Login</button>

</form>

<p><a href="/signup">Create account</a></p>

</div>

</body>
</html>
