<!DOCTYPE html>
<html>

<head>
<title>AI Interview Trainer</title>
</head>

<body>

<h2>AI Interview Trainer</h2>

<div id="chatbox">

<p><b>AI:</b> {{ question }}</p>

</div>

<form action="/next-question" method="POST">

<textarea name="answer" rows="4" cols="60"
placeholder="Type your answer..."></textarea>

<br><br>

<button type="submit">Submit Answer</button>

</form>

</body>

</html>
