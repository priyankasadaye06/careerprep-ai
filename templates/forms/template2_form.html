<!DOCTYPE html>
<html>
<head>
    <title>Fill Resume - Template 2</title>
   <style>
    body {
        font-family: 'Segoe UI', sans-serif;
        background: #f4f7fb;
        margin: 0;
        padding: 20px;
    }

    .container {
        max-width: 900px;
        margin: auto;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
        color: #2d6cdf;
    }

    h2 {
        margin-top: 30px;
        color: #333;
        border-left: 4px solid #2d6cdf;
        padding-left: 10px;
    }

    input, textarea {
        width: 100%;
        padding: 10px;
        margin-top: 8px;
        margin-bottom: 15px;
        border-radius: 8px;
        border: 1px solid #ddd;
        transition: 0.3s;
    }

    input:focus, textarea:focus {
        border-color: #2d6cdf;
        outline: none;
        box-shadow: 0 0 5px rgba(45,108,223,0.2);
    }

    .row {
        display: flex;
        gap: 10px;
    }

    .row input, .row textarea {
        flex: 1;
    }

    button {
        background: #2d6cdf;
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
        transition: 0.3s;
    }

    button:hover {
        background: #1b4fbf;
    }

    .add-btn {
        background: #28a745;
    }

    .add-btn:hover {
        background: #1e7e34;
    }
</style>
</head>
<body>

<h1>Fill Your Resume (Template 2)</h1>

<form action="/preview" method="POST">

    <!-- BASIC INFO -->
    <div class="section">
        <h2>Basic Info</h2>
        <input type="text" name="name" placeholder="Full Name" required>
        <input type="text" name="location" placeholder="Location">
        <input type="email" name="email" placeholder="Email">
        <input type="text" name="phone" placeholder="Phone">
        <input type="text" name="linkedin" placeholder="LinkedIn URL">
        <input type="text" name="github" placeholder="GitHub URL">
    </div>

    <!-- SUMMARY -->
    <div class="section">
        <h2>Summary</h2>
        <textarea name="summary" placeholder="Write summary..."></textarea>
    </div>

    <!-- EXPERIENCE -->
    <div class="section">
        <h2>Experience</h2>

        <input type="text" name="exp_role_1" placeholder="Role">
        <input type="text" name="exp_company_1" placeholder="Company">
        <input type="text" name="exp_duration_1" placeholder="Duration">
        <input type="text" name="exp_location_1" placeholder="Location">
        <textarea name="exp_points_1" placeholder="Enter points (one per line)"></textarea>
    </div>

    <!-- EDUCATION -->
    <div class="section">
        <h2>Education</h2>

        <input type="text" name="edu_degree_1" placeholder="Degree">
        <input type="text" name="edu_college_1" placeholder="College">
        <input type="text" name="edu_year_1" placeholder="Year">
    </div>

    <!-- SKILLS -->
    <div class="section">
        <h2>Skills</h2>

        <input type="text" name="skills_languages" placeholder="Languages (comma separated)">
        <input type="text" name="skills_frameworks" placeholder="Frameworks">
        <input type="text" name="skills_tools" placeholder="Tools">
        <input type="text" name="skills_databases" placeholder="Databases">
    </div>

    <!-- PROJECTS -->
    <div class="section">
        <h2>Projects</h2>
        <textarea name="projects" placeholder="One project per line"></textarea>
    </div>

    <!-- CERTIFICATIONS -->
    <div class="section">
        <h2>Certifications</h2>
        <textarea name="certifications" placeholder="One certification per line"></textarea>
    </div>

    <!-- 🔥 CUSTOM SECTIONS -->
    <div class="section">
        <h2>Custom Sections (Optional)</h2>

        <div id="custom-fields">

            <div class="row">
                <input type="text" name="custom_key_1" placeholder="Section Title (e.g. Achievements)">
                <textarea name="custom_value_1" placeholder="Content (one per line)"></textarea>
            </div>

        </div>

        <button type="button" onclick="addCustomField()">+ Add More Section</button>
    </div>

    <button type="submit">Generate Resume</button>

</form>

<script>
let count = 1;

function addCustomField() {
    count++;

    const container = document.getElementById("custom-fields");

    const div = document.createElement("div");
    div.classList.add("row");

    div.innerHTML = `
        <input type="text" name="custom_key_${count}" placeholder="Section Title">
        <textarea name="custom_value_${count}" placeholder="Content (one per line)"></textarea>
    `;

    container.appendChild(div);
}
</script>

</body>
</html>
