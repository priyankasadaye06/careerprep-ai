<!DOCTYPE html>
<html>
<head>
    <title>AI Interview Trainer</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f5f7fb;
            margin: 0;
        }

        h2 {
            text-align: center;
            padding: 15px;
            background: #4a6cf7;
            color: white;
            margin: 0;
        }

        #chat-box {
            height: 75vh;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .msg {
            padding: 12px 15px;
            margin: 8px 0;
            border-radius: 12px;
            max-width: 65%;
            line-height: 1.5;
            animation: fadeIn 0.3s ease-in-out;
        }

        .user {
            background: #4a6cf7;
            color: white;
            align-self: flex-end;
        }

        .ai {
            background: white;
            border: 1px solid #ddd;
            align-self: flex-start;
        }

        .typing {
            display: flex;
            gap: 5px;
            padding: 10px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: gray;
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px);}
            to { opacity: 1; transform: translateY(0);}
        }

        #input-area {
            display: flex;
            padding: 10px;
            background: white;
            border-top: 1px solid #ddd;
        }

        #user_input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            margin-left: 10px;
            padding: 12px 20px;
            background: #4a6cf7;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #3a55d1;
        }

        .score {
            color: green;
            font-weight: bold;
        }

        .feedback {
            color: #333;
        }

    </style>
</head>

<body>

<h2>🤖 AI Interview Trainer</h2>

<div id="chat-box"></div>

<div id="input-area">
    <input type="text" id="user_input" placeholder="Type your answer...">
    <button onclick="sendMessage()">Send</button>
</div>

<script>
const chatBox = document.getElementById("chat-box");

// ADD MESSAGE
function addMessage(text, className) {
    let div = document.createElement("div");
    div.className = "msg " + className;

    if (className === "ai") {
        // Format AI output nicely
        let formatted = text
            .replace(/Score:\s*(\d+\/10)/gi, '<br><span class="score">Score: $1</span>')
            .replace(/Feedback:/gi, '<br><b>Feedback:</b>')
            .replace(/Next Question:/gi, '<br><b>Next Question:</b>');

        div.innerHTML = formatted;
    } else {
        div.innerText = text;
    }

    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}

// TYPING ANIMATION
function showTyping() {
    let div = document.createElement("div");
    div.className = "msg ai typing";
    div.id = "typing";

    div.innerHTML = `
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    `;

    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}

function removeTyping() {
    let typing = document.getElementById("typing");
    if (typing) typing.remove();
}

// FIRST MESSAGE
window.onload = function() {
    addMessage("Hello! Let's begin your interview.\nTell me about yourself.", "ai");
};

// SEND MESSAGE
async function sendMessage() {

    let input = document.getElementById("user_input");
    let message = input.value;

    if (!message) return;

    addMessage(message, "user");
    input.value = "";

    showTyping();

    try {
        let response = await fetch("/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ message: message })
        });

        let data = await response.json();

        removeTyping();
        addMessage(data.reply, "ai");

    } catch (error) {
        removeTyping();
        addMessage("⚠️ Error connecting to AI", "ai");
    }
}

// ENTER KEY
document.getElementById("user_input").addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
        sendMessage();
    }
});
</script>

</body>
</html>
