<!DOCTYPE html>
<html>
<head>
    <title>AI Interview Chatbot</title>
</head>

<body>

<h2>AI Interview Chatbot</h2>

<!-- CHAT DISPLAY -->
<div id="chat-box" style="border:1px solid #ccc; padding:15px; height:300px; overflow-y:scroll;">
</div>

<br>

<!-- INPUT -->
<input type="text" id="user_input" placeholder="Type your answer..." style="width:70%; padding:10px;">

<!-- BUTTON -->
<button onclick="sendMessage()">Send</button>

<script>
async function sendMessage() {

    let input = document.getElementById("user_input");
    let message = input.value;

    if (!message) return;

    let chatBox = document.getElementById("chat-box");

    // show user message
    chatBox.innerHTML += "<p><b>You:</b> " + message + "</p>";

    input.value = "";

    let response = await fetch("/chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ message: message })
    });

    let data = await response.json();

    // show AI response
    chatBox.innerHTML += "<p><b>AI:</b> " + data.reply + "</p>";

    // auto scroll
    chatBox.scrollTop = chatBox.scrollHeight;
}
</script>

</body>
</html>
