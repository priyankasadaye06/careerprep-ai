<!DOCTYPE html>
<html>
<head>
    <title>AI Interview Chatbot</title>

    <style>
        body {
            font-family: Arial;
        }

        #chat-box {
            border:1px solid #ccc;
            padding:15px;
            height:350px;
            overflow-y:scroll;
            display:flex;
            flex-direction:column;
        }

        .msg {
            padding:10px;
            margin:5px;
            border-radius:10px;
            max-width:70%;
        }

        .user {
            background:#d1e7ff;
            align-self:flex-end;
        }

        .ai {
            background:#eee;
            align-self:flex-start;
        }
    </style>
</head>

<body>

<h2>AI Interview Chatbot</h2>

<!-- CHAT -->
<div id="chat-box"></div>

<br>

<input type="text" id="user_input" placeholder="Type your answer..." style="width:70%; padding:10px;">
<button onclick="sendMessage()">Send</button>

<script>
const chatBox = document.getElementById("chat-box");

// ✅ ADD MESSAGE FUNCTION
function addMessage(text, className) {
    let div = document.createElement("div");
    div.className = "msg " + className;
    div.innerText = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}

// ✅ FIRST AI MESSAGE
window.onload = function() {
    addMessage("Hello! Let's begin your interview. Tell me about yourself.", "ai");
};

// ✅ SEND MESSAGE
async function sendMessage() {

    let input = document.getElementById("user_input");
    let message = input.value;

    if (!message) return;

    addMessage(message, "user");

    input.value = "";

    let response = await fetch("/chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ message: message })
    });

    let data = await response.json();

    addMessage(data.reply, "ai");
}

// ✅ ENTER KEY SUPPORT
document.getElementById("user_input").addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
        sendMessage();
    }
});
</script>

</body>
</html>
