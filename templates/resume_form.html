{% extends "base.html" %}

{% block title %}Resume Builder{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8">

        <div class="glass-card p-5 shadow-lg">
            <h3 class="text-center mb-4">
                Create Your Resume
            </h3>

            <form action="/generate" method="POST">

                <!-- Full Name -->
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" name="name" required>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" name="email" required>
                </div>

                <!-- Phone -->
                <div class="mb-3">
                    <label class="form-label">Phone</label>
                    <input type="text" class="form-control" name="phone" required>
                </div>

                <!-- Education -->
                <div class="mb-3">
                    <label class="form-label">Education</label>
                    <textarea class="form-control" rows="2" name="education" required></textarea>
                </div>

                <!-- Skills -->
                <div class="mb-3">
                    <label class="form-label">Skills</label>
                    <textarea class="form-control" rows="2" name="skills" required></textarea>
                </div>

                <!-- Projects -->
                <div class="mb-3">
                    <label class="form-label">Projects</label>
                    <textarea class="form-control" rows="3" name="projects" required></textarea>
                </div>

                <!-- Submit Button -->
                <div class="text-center">
                    <button type="submit" class="btn btn-custom">
                        Generate Resume
                    </button>
                </div>

            </form>
        </div>

    </div>
</div>

{% endblock %}
