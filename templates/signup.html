<!DOCTYPE html>
<html>
<head>
    <title>Signup - CareerPrep AI</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Card */
.container {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(12px);
    padding: 35px;
    border-radius: 15px;
    width: 350px;
    color: white;
    text-align: center;
}

/* Inputs */
input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: none;
    border-radius: 8px;
    outline: none;
}

/* Button */
button {
    width: 100%;
    padding: 12px;
    background: #4a6cf7;
    border: none;
    color: white;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #3a55d1;
}

/* Link */
a {
    color: #fff;
    text-decoration: underline;
}
</style>
</head>

<body>

<div class="container">

    <h2>Create Account</h2>

    <form method="POST" action="/signup">

        <input type="text" name="name" placeholder="Full Name" required>

        <input type="email" name="email" placeholder="Email" required>

        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Sign Up</button>

    </form>

    <p>Already have an account? <a href="/login">Login</a></p>

</div>

</body>
</html>
