<!DOCTYPE html>
<html>
<head>
    <title>Interview Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #eef2f3, #dfe9f3);
            text-align: center;
        }

        h1 {
            margin-top: 40px;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 60px;
        }

        .card {
            width: 250px;
            padding: 25px;
            border-radius: 15px;
            background: white;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .card p {
            font-size: 14px;
            color: gray;
        }

        .btn {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

<h1>🚀 AI Interview Dashboard</h1>
<p>Select your training mode</p>

<div class="container">

    <!-- 🤖 CHATBOT -->
    <div class="card">
        <h3>AI Chatbot Interview</h3>
        <p>Interactive interview with feedback and scoring</p>

        <form action="/chatbot">
            <button class="btn">Start</button>
        </form>
    </div>

    <!-- 🏢 COMPANY MODE -->
    <div class="card">
        <h3>Company-Based Training</h3>
        <p>Practice questions from top tech companies</p>

        <form action="/company-fyq">
            <button class="btn">Start</button>
        </form>
    </div>

    <!-- 🧪 MOCK TEST -->
    <div class="card">
        <h3>Mock Test</h3>
        <p>Take full-length test from external platform</p>

        <!-- Replace with real link -->
        <a href="https://www.hackerrank.com" target="_blank">
            <button class="btn">Start</button>
        </a>
    </div>

</div>

</body>
</html>
