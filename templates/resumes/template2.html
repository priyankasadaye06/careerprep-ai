<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: "Calibri", sans-serif;
            margin: 40px;
        }
        h1 {
            text-transform: uppercase;
            color: #1f3c88;
        }
        h2 {
            background: #f0f0f0;
            padding: 5px;
            color: #1f3c88;
        }
        .section {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<h1>{{name}}</h1>
<p>{{title}} | {{email}} | {{phone}}</p>

<div class="section">
    <h2>Profile</h2>
    <p>{{profile}}</p>
</div>

<div class="section">
    <h2>Education</h2>
    <p>{{education}}</p>
</div>

<div class="section">
    <h2>Work Experience</h2>
    <p>{{experience}}</p>
</div>

<div class="section">
    <h2>Skills</h2>
    <ul>
        {{skills}}
    </ul>
</div>

<h2>ATS Enhancements</h2>
<ul>
{% for point in enhanced_points %}
    <li>{{ point }}</li>
{% endfor %}
</ul>

</body>
</html>
