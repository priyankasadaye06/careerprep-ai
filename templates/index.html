<!DOCTYPE html>
<html>
<head>
    <title>AI Resume Generator</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<h2>AI Resume Generator</h2>

<form action="/generate" method="POST">

<h3>Personal Details</h3>
<input name="name" placeholder="Full Name" required>
<input name="phone" placeholder="Phone">
<input name="email" placeholder="Email">
<input name="linkedin" placeholder="LinkedIn URL">
<input name="github" placeholder="GitHub URL">

<h3>Target Role</h3>
<input name="role" placeholder="e.g. Software Engineer">

<h3>Education</h3>
<textarea name="education" placeholder="Degree, College, CGPA"></textarea>

<h3>Skills</h3>
<textarea name="skills" placeholder="Technical, Tools, Soft Skills"></textarea>

<h3>Projects</h3>
<textarea name="projects" placeholder="Title, Tech Stack, Description"></textarea>

<h3>Experience</h3>
<textarea name="experience" placeholder="Internship / Freelance / Campus Roles"></textarea>

<h3>Certificates</h3>
<textarea name="certificates"></textarea>

<h3>Select Resume Template</h3>
<select name="template">
    <option value="template1">2-Column</option>
    <option value="template2">Professional Business</option>
    <option value="template3">Resume with Photo</option>
    <option value="template4">Simple 1 column</option>
    <option value="template5">Education Focused Resume</option>
</select>

<br><br>
<button type="submit">Generate Resume</button>

</form>
</body>
</html>
